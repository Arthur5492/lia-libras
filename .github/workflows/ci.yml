name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm ci --prefix tests/firestore-rules
      - run: npm run typecheck
      - name: Tests on the Firebase emulators
        run: npx firebase emulators:exec --only auth,firestore --project demo-libras "npm test && npm --prefix tests/firestore-rules test"
      - run: npm run build

  training:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: Tests of the training code (the test of the full training needs TensorFlow, so it is skipped)
        working-directory: training
        run: python -m unittest discover -s tests -t .

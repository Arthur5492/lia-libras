name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm ci --prefix tests/firestore-rules
      - run: npm run typecheck
      - name: Tests on the Firebase emulators
        run: npx firebase emulators:exec --only auth,firestore --project demo-libras "npm test && npm --prefix tests/firestore-rules test"
      - run: npm run build

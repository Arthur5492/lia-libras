[project]
name = "libras-pwa"
version = "0.1.0"
description = "API for the PWA that collects, reviews and recognizes Libras signs"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "firebase-admin>=6.5",
    "huggingface_hub>=0.30",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "requests>=2.31",
]

[tool.pytest.ini_options]
testpaths = ["tests/api"]
pythonpath = ["."]
